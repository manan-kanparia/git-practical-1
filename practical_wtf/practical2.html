<html>
    <head>
        <title>form</title>

    </head>
    <form autocomplete="on">
        <fieldset>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="sample@gmail.com" required>
            <br>
            <label for="password">password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" minlength="12" autocomplete="new-password" pattern="[A-Z]{3}[a-z]{4}[0-9]{2}[@]{1}[A-Z,a-z]{2}" required>
            <br>
            <label for="select">Role:</label>
            <select id="select" name="Role">
                <option value="student">student</option>
                <option value="faculty">faculty</option>
                <option value="admin">admin</option>
            </select>
            <br>
            <label for="checkbox">Remember me on this device</label>
            <input id="checkbox" type="checkbox" name="agreed">
            <br>
            <button type="submit">Login</button>
            <button type="submit">clear</button>
            <br>
            
            <br>
            <a href="forgot password?">forgot password?</a> 

        </fieldset>
    </form>
</html>
